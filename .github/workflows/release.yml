name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/bolture-$os-$arch" ./cmd/bolture
          done
      - name: Checksums
        run: |
          cd dist
          sha256sum bolture-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bolture-linux-amd64
            dist/bolture-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true
